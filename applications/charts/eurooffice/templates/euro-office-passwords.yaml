metadata:
  creationTimestamp: null
  name: euro-office-passwords
  namespace: eurooffice
spec:
  encryptedData:
    postgres-password: 
    rabbitmq-password: 
    redis-password: 
    sentinel-password: 
  template:
    metadata:
      creationTimestamp: null
      name: euro-office-passwords
      namespace: eurooffice
    type: Opaque