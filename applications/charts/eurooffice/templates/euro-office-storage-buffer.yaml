#
#  Storage for the buffer
#
apiVersion: v1
kind: PersistentVolume
metadata:
  name: euro-office-storage-buffer
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"    
  labels:
    app: euro-office-storage-buffer
spec:
  capacity:
    storage: 50Gi
  nfs:
    server: nas.crazyzone.be
    path: "/volume1/docker-storage/euro-office/buffer"    
  mountOptions:
    - noac
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: euro-office-storage-buffer-claim
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  selector:
    matchLabels:
      app: euro-office-storage-buffer
  resources:
    requests:
      storage: 50Gi
